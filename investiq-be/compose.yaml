name: investiq
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: investiq
      POSTGRES_PASSWORD: investiq_local
      POSTGRES_DB: investiq
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investiq -d investiq"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    profiles: ["app"]
    environment:
      INVESTIQ_DATABASE_URL: postgresql+asyncpg://investiq:investiq_local@postgres:5432/investiq
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
  market-seed:
    build: .
    profiles: ["app"]
    environment:
      INVESTIQ_DATABASE_URL: postgresql+asyncpg://investiq:investiq_local@postgres:5432/investiq
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "investiq.market_cli"]
  learning-seed:
    build: .
    profiles: ["app"]
    environment:
      INVESTIQ_DATABASE_URL: postgresql+asyncpg://investiq:investiq_local@postgres:5432/investiq
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "investiq.learning_cli"]
  api:
    build: .
    profiles: ["app"]
    environment:
      INVESTIQ_DATABASE_URL: postgresql+asyncpg://investiq:investiq_local@postgres:5432/investiq
      INVESTIQ_REDIS_URL: redis://redis:6379/0
      INVESTIQ_SMTP_HOST: mailpit
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      learning-seed:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
      market-seed:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 3
  worker:
    build: .
    profiles: ["app"]
    environment:
      INVESTIQ_DATABASE_URL: postgresql+asyncpg://investiq:investiq_local@postgres:5432/investiq
      INVESTIQ_REDIS_URL: redis://redis:6379/0
      INVESTIQ_CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      market-seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["celery", "-q", "-A", "investiq.jobs.valuation:app", "worker", "--loglevel=WARNING", "--concurrency=2"]
    healthcheck:
      test: ["CMD-SHELL", "celery -q -A investiq.jobs.valuation:app inspect ping --destination celery@$$HOSTNAME --timeout 3"]
      interval: 15s
      timeout: 8s
      retries: 5
  beat:
    build: .
    profiles: ["app"]
    environment:
      INVESTIQ_DATABASE_URL: postgresql+asyncpg://investiq:investiq_local@postgres:5432/investiq
      INVESTIQ_REDIS_URL: redis://redis:6379/0
      INVESTIQ_CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      worker:
        condition: service_healthy
    command: ["celery", "-q", "-A", "investiq.jobs.valuation:app", "beat", "--loglevel=WARNING", "--schedule=/tmp/investiq-celerybeat"]
volumes:
  postgres_data:
  redis_data:
